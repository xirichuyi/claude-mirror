[package]
name = "winc-preview"
description = "预览的解析和光栅化：图片解码（PNG、JPEG、GIF、WebP、BMP、ICO）、SVG、Markdown（含公式和 mermaid）。不依赖编辑器和 GUI。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
memchr.workspace = true
png.workspace = true
zune-jpeg.workspace = true
gif.workspace = true
image-webp.workspace = true
roxmltree.workspace = true
# 读 xlsx（zip 压缩包）中 deflate 压缩的文件；png 已经用到同一版本，不多出新的 crate。
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
pulldown-cmark.workspace = true
zeno.workspace = true
winc-i18n.workspace = true

# macOS：要缩小的 JPEG 交给 ImageIO 按目标大小解码（见 src/image/imageio.rs）。和 winc-render 用的
# 是同一版本的绑定，不多出新的 crate。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }

[lints]
workspace = true
