name: Windows native
on:
  push:
    paths: ['windows/**', 'src/**', 'scripts/**', 'tsconfig*.json', 'package.json', 'package-lock.json', '.github/workflows/windows.yml', 'macos/scripts/prepare-server.cts']
  pull_request:
    paths: ['windows/**', 'src/**', 'scripts/**', 'tsconfig*.json', 'package.json', 'package-lock.json', '.github/workflows/windows.yml', 'macos/scripts/prepare-server.cts']
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  # The system SSH login end to end against a Unix server: remote agent, jump host, upload, download, port forward.
  system-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run prepare-server -- "$RUNNER_TEMP/server"
      - name: Remote agent over the system SSH client, directly and through a jump host
        run: |
          sudo mkdir -p /run/sshd
          export CLAUDE_MIRROR_TEST_SSH_CONFIG="$(sh windows/ClaudeMirror.Tests/test-sshd.sh "$RUNNER_TEMP/mirror-sshd")"
          export CLAUDE_MIRROR_TEST_RESOURCES="$RUNNER_TEMP/server"
          sudo useradd -m mirror-runner
          export CLAUDE_MIRROR_TEST_SUDO_ACCOUNT=mirror-runner
          ssh -F "$CLAUDE_MIRROR_TEST_SSH_CONFIG" -o BatchMode=yes mirror-jumped 'echo ready' || { cat "$RUNNER_TEMP/mirror-sshd/sshd.log"; exit 1; }
          dotnet test windows/ClaudeMirror.Tests -c Release --filter "FullyQualifiedName~SystemSshTests" --logger "console;verbosity=normal" | tee "$RUNNER_TEMP/system-ssh.log"
          # A skipped test here would mean the server was not reached at all.
          ! grep -q "Skipped SystemSshTests" "$RUNNER_TEMP/system-ssh.log"
          grep -q "Passed SystemSshTests.ARootLoginStoresAnAttachmentAsTheExecutionAccount" "$RUNNER_TEMP/system-ssh.log"
      - name: A root login trashes an execution account's history without acting as root in that home
        run: |
          sudo env CLAUDE_MIRROR_TEST_SUDO_ACCOUNT=mirror-runner "$(command -v node)" --test --test-reporter=tap --test-name-pattern="as root" build/test/history.test.cjs | tee "$RUNNER_TEMP/root-history.log"
          grep -q "^# pass 1$" "$RUNNER_TEMP/root-history.log"
          grep -q "^# skipped 0$" "$RUNNER_TEMP/root-history.log"
  native:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run prepare-server -- windows/Resources/server
      - run: dotnet test windows/ClaudeMirror.Tests -c Release
      - name: System SSH transport against a local sshd (the real ssh.exe)
        shell: pwsh
        run: |
          $env:CLAUDE_MIRROR_TEST_SSH_CONFIG = ./windows/ClaudeMirror.Tests/test-sshd.ps1 (Join-Path $env:RUNNER_TEMP 'mirror-sshd')
          dotnet test windows/ClaudeMirror.Tests -c Release --no-build --filter "FullyQualifiedName~SystemSshTests" --logger "console;verbosity=normal"
          if ($LASTEXITCODE) { throw 'System SSH tests failed' }
      - name: Read shared product version
        id: product
        shell: pwsh
        run: |
          [xml]$plist = Get-Content macos/Resources/Info.plist -Raw
          $version = $plist.SelectSingleNode('//key[text()="CFBundleShortVersionString"]/following-sibling::string[1]').InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid product version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: dotnet publish windows/ClaudeMirror.App -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ steps.product.outputs.version }} -o windows/dist/claude-mirror
      - name: Verify native window starts
        shell: pwsh
        run: |
          $marker = Join-Path $env:TEMP 'claude-mirror-smoke.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          $app = Start-Process windows/dist/claude-mirror/claude-mirror.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'WinUI startup timed out' }
          if ($app.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw "WinUI startup failed: $($app.ExitCode)" }
          Get-Content $marker
      - name: Verify SSH setup buttons in the published client
        shell: pwsh
        run: ./windows/test-host-dialog.ps1 windows/dist/claude-mirror/claude-mirror.exe
      - name: Render demo scenes
        shell: pwsh
        run: ./windows/capture-screenshots.ps1 windows/dist/claude-mirror/claude-mirror.exe windows/dist/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-mirror-windows-screenshots
          path: windows/dist/screenshots
          if-no-files-found: warn
      - name: Package portable Windows client
        shell: pwsh
        run: |
          Compress-Archive -Path windows/dist/claude-mirror/* -DestinationPath windows/dist/claude-mirror-windows-x64.zip
          (Get-FileHash windows/dist/claude-mirror-windows-x64.zip -Algorithm SHA256).Hash | Set-Content windows/dist/claude-mirror-windows-x64.zip.sha256
      - name: Build Windows installer
        shell: pwsh
        run: ./windows/build-installer.ps1 -Version "${{ steps.product.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: claude-mirror-windows-installer
          path: windows/dist/Claude-Mirror-Setup-x64.exe*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: claude-mirror-windows-x64
          path: windows/dist/*.zip*
          if-no-files-found: error
