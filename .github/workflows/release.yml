name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and upload, for example v0.17.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  windows:
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    uses: ./.github/workflows/windows.yml
    with:
      revision: ${{ inputs.tag || github.ref_name }}
  publish-windows-installer:
    needs: [windows, dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claude-mirror-windows-installer
          path: installer
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" installer/Claude-Mirror-Setup-x64.exe* --repo "$GITHUB_REPOSITORY" --clobber
  dmg:
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    name: Build and publish DMG
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Use the newest stable Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Tag must match the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' macos/Resources/Info.plist)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Info.plist version $version does not match tag $TAG"
            exit 1
          fi
      - run: python3 macos/scripts/test-publish-appcast.py
      - run: swift test --package-path macos
      - run: sh macos/scripts/build-dmg.sh
      - name: Sign the update archive and feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::Missing Sparkle signing key"; exit 1; }
          bash macos/scripts/generate-appcast.sh
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="macos/dist/claude-mirror-${TAG#v}-macOS-arm64.dmg"
          files=("$dmg" "$dmg.sha256" macos/dist/appcast.xml scripts/setup-remote.sh scripts/install-claude-remote.sh)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            notes="docs/releases/$TAG.md"
            if [ -f "$notes" ]; then source=(--notes-file "$notes"); else source=(--generate-notes); fi
            gh release create "$TAG" --title "claude-mirror $TAG" "${source[@]}" --verify-tag "${files[@]}"
          fi
      - name: Publish the stable update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 macos/scripts/publish-appcast.py
      - uses: actions/upload-artifact@v4
        with:
          name: claude-mirror-${{ env.TAG }}-macOS-arm64
          path: |
            macos/dist/*.dmg
            macos/dist/*.dmg.sha256
          if-no-files-found: error
