name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test
      - name: Real Claude Code CLI against a scripted API
        run: node --test build/test/*.e2e.cjs
      - run: python3 scripts/test-stable-release.py

  android:
    name: Android tests and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The app carries the Node remote agent, and the tests run it.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: tether-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  macos:
    name: macOS tests and DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest stable Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The Swift tests and the app bundle both use the Node remote agent.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==12.2.0
      - run: swift test --package-path macos
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - run: cargo test --locked --manifest-path vendor/winc-preview/Cargo.toml -p winc-preview
      - run: sh macos/scripts/build-dmg.sh
      - name: Verify bundled Winc preview bridge
        run: WINC_PREVIEW_HELPER="$PWD/macos/dist/Tether.app/Contents/MacOS/WincPreview" python3 macos/Helpers/WincPreview/tests/smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: tether-macOS-arm64-${{ github.sha }}
          path: |
            macos/dist/*.dmg
            macos/dist/*.dmg.sha256
          retention-days: 14
          if-no-files-found: error
