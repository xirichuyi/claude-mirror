name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test
      - run: python3 scripts/test-stable-release.py

  macos:
    name: macOS tests and DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest stable Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Swift tests and the app bundle both use the Node remote agent.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: swift test --package-path macos
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - run: cargo test --locked --manifest-path vendor/winc-preview/Cargo.toml -p winc-preview
      - run: sh macos/scripts/build-dmg.sh
      - name: Verify bundled Winc preview bridge
        run: WINC_PREVIEW_HELPER="$PWD/macos/dist/claude-mirror.app/Contents/MacOS/WincPreview" python3 macos/Helpers/WincPreview/tests/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: claude-mirror-macOS-arm64-${{ github.sha }}
          path: |
            macos/dist/*.dmg
            macos/dist/*.dmg.sha256
          retention-days: 14
          if-no-files-found: error
